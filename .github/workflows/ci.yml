
name: Test, Build and Push to Docker Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Step 1: Run automated tests
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACING_ENABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.2 httpx==0.28.1

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests/ -v

  # Step 2: Only build if tests pass
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify model artifacts
        run: |
          test -f artifacts/model/MLmodel
          test -f artifacts/model/feature_columns.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mazraza05/telco-api:latest
