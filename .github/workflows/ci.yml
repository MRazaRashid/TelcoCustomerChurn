
name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: Verify model artifacts
      - name: Verify model files
        run: |
          test -f artifacts/model/MLmodel
          test -f artifacts/model/feature_columns.txt
          test -f requirements.txt
          test -f Dockerfile

      # Step 3: Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 4: Authenticate to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: mazraza05/telco-api:latest
